{% macro citation_input(name="citation", value="", placeholder="e.g., 42 CFR 2.2", id=none, show_button=true) %}
<fieldset role="group" class="citation-group">
    <input type="text" {% if id %}id="{{ id }}"{% endif %} name="{{ name }}" value="{{ value }}" placeholder="{{ placeholder }}">
    {% if show_button %}<input type="submit" value="Go">{% endif %}
</fieldset>
{% endmacro %}
